name: Validate CSV

on:
  pull_request:
    paths:
      - 'books.csv'
      - 'scripts/validate_csv.py'
      - 'scripts/taxonomy.py'
      - 'scripts/generate_books_table.py'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run CSV validation script
        run: |
          python scripts/validate_csv.py
        
      - name: Verify table generation
        run: |
          # Try to generate the table to ensure it works
          python scripts/generate_books_table.py > /dev/null